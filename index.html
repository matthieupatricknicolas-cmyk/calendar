<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2937">
<title>Calendrier 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--bar:#1f2937;--bg:#f3f4f6}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
#app{display:flex;flex-direction:column;height:100%}
header{background:var(--bar);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;z-index:1600;position:relative}
.row{display:flex;gap:6px;align-items:center;justify-content:space-between}
header select{flex:1;min-width:0;font-size:14px;padding:6px;border-radius:8px;border:0}
.btn.on{background:#2563eb}
.gps-pin{background:none;border:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.btn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:14px}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.chip{flex:none;border:2px solid var(--c);color:#fff;background:transparent;border-radius:999px;padding:4px 10px;font-size:13px}
.chip.on{background:var(--c)}
#main{flex:1;min-height:0;display:flex}
#map{flex:1;min-width:0}
#dash{width:340px;flex:none;background:#fff;border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px 20px}
#dash h2{margin:0;font-size:16px}
#dash .sub{color:var(--mut);font-size:12.5px}
#dclose{display:none}
#dbtn{display:none}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.kpi{background:var(--bg);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mut)}
.donut{position:relative;width:170px;height:170px;margin:12px auto 6px}
.donut svg{width:100%;height:100%}
.donut circle.seg{cursor:pointer;transition:opacity .15s}
.donut circle.seg.off{opacity:.18}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dc b{font-size:28px;line-height:1}
.dc span{font-size:12px;color:var(--mut)}
.leg{display:grid;gap:2px}
.leg button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:5px 2px;font-size:14px;text-align:left;border-radius:6px}
.leg button.off{opacity:.4}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.leg .n{margin-left:auto;font-variant-numeric:tabular-nums}
.leg .p{width:42px;text-align:right;color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums}
h3.sec{margin:18px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.day{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;padding:4px 0;font-size:13.5px}
.day .bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.day .bar i{display:block;height:100%;background:#16a34a;border-radius:4px}
.day .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.day .v small{display:block;color:var(--mut);font-size:11.5px}
.tot{display:flex;justify-content:space-between;border-top:2px solid var(--ink);margin-top:8px;padding-top:8px;font-weight:600;font-variant-numeric:tabular-nums}
.empty{color:var(--mut);font-size:13px;padding:8px 0}
#login,#panel,#wait{position:fixed;inset:0;background:var(--bg);z-index:2000;display:none;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px 20px;overflow:auto}
.card{max-width:420px;margin:0 auto;background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.card input,.card select{width:100%;font-size:16px;padding:10px;border:1px solid #d1d5db;border-radius:8px;margin:6px 0}
.card button.go{width:100%;font-size:16px;padding:11px;border:0;border-radius:8px;background:var(--bar);color:#fff;margin-top:6px}
#panel .card{max-width:620px}
.afilt{display:flex;gap:6px;margin:10px 0 4px}.afilt button{border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:5px 12px;font-size:13px}.afilt button.on{background:#1f2937;color:#fff;border-color:#1f2937}
.ar{display:grid;grid-template-columns:1fr minmax(130px,44%);gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.ar b{display:block;font-size:14px}.ar small{color:var(--mut);font-size:12px}
.card .ar select{margin:0;font-size:15px;padding:8px}.ar.free select{border-color:#f59e0b;background:#fffbeb}
.lnk{display:block;width:100%;background:none;border:0;color:#2563eb;font-size:14px;margin-top:10px;padding:6px}
.exp{width:100%;margin-top:10px;padding:9px;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:8px;font-size:14px}
.mo{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px;font-variant-numeric:tabular-nums}
.mo small{color:var(--mut);margin-left:6px}
.atools{display:grid;gap:6px;margin:10px 0 2px}
.atools button{border:1px solid #1f2937;background:#fff;border-radius:8px;padding:9px;font-size:14px}
.atools button.danger{border-color:#dc2626;color:#dc2626}
.atools button.armed{background:#1f2937;color:#fff}
.atools button.danger.armed{background:#dc2626;color:#fff}
.msg{font-size:13px;color:var(--mut);margin-top:8px}
.leaflet-popup-content{margin:12px 14px;min-width:220px}
.leaflet-popup-content h3{margin:0 0 2px;font-size:16px}
.pop .sub{color:var(--mut);font-size:13px}
.pop label{display:block;color:var(--mut);font-size:12.5px;margin-top:8px}
.pop select,.pop input{width:100%;font-size:16px;padding:8px;border-radius:8px;border:2px solid #d1d5db;background:#fff;margin:2px 0}
.pop select{border-color:var(--c,#999)}
.pop .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-right:22px}
.pop .plus{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:#16a34a;color:#fff;font-size:26px;line-height:1;padding:0;transition:transform .15s}
.pop .plus.on{background:#6b7280}
.vform{background:#f3f4f6;border-radius:10px;padding:6px 10px 10px;margin:10px 0 4px}
.vr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-top:1px solid #e5e7eb;font-size:14px}
.vr small{display:block;color:var(--mut);font-size:12px}
.vr button{border:0;background:none;color:#dc2626;font-size:14px;padding:4px 8px;border-radius:6px}
.vr button.armed{background:#dc2626;color:#fff}
.pop .save{width:100%;margin-top:8px;font-size:16px;padding:10px;border:0;border-radius:8px;background:var(--bar);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;z-index:3000;display:none;max-width:90vw}
@media (max-width:899px){
  #dbtn{display:inline-block}
  #dclose{display:inline-block}
  #dash{position:fixed;top:0;right:0;bottom:0;width:min(92vw,380px);z-index:1700;transform:translateX(100%);transition:transform .2s;box-shadow:-4px 0 16px rgba(0,0,0,.2);padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
  #dash.open{transform:none}
}
</style>
</head>
<body>
<div id="login"><div class="card">
  <h2 style="margin-top:0">Calendrier 2026</h2>
  <p class="sub">Connectez-vous avec votre identifiant (binome1 à binome20).</p>
  <input id="email" type="text" placeholder="Identifiant (ex. binome3) ou e-mail" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
  <input id="pwd" type="password" placeholder="Mot de passe" autocomplete="current-password">
  <button class="go" id="signin">Se connecter</button>
  <button class="lnk" id="send">Administrateur : recevoir un lien par e-mail</button>
  <div class="msg" id="lmsg"></div>
</div></div>

<div id="wait"><div class="card">
  <h2 style="margin-top:0">Compte créé</h2>
  <p>Votre compte n'a pas encore de tournée. Un administrateur doit vous en affecter une : vous aurez alors accès à la carte.</p>
  <p class="sub" id="wmail"></p>
  <button class="go" id="wreload">Actualiser</button>
  <button class="go" id="wout" style="background:#6b7280">Se déconnecter</button>
</div></div>

<div id="panel"><div class="card">
  <div class="row"><h3 style="margin:0">Affectation des tournées</h3><button class="btn" style="background:#1f2937" id="pclose">Fermer</button></div>
  <div class="sub" id="asum" style="margin-top:6px"></div>
  <div class="atools"><button id="a_rep">⚖ Répartir automatiquement</button><button id="a_clear" class="danger">Retirer toutes les affectations</button></div>
  <div class="afilt"><button id="af_all" class="on">Toutes</button><button id="af_free">Sans binôme</button></div>
  <div id="alist"></div>
  <div class="sub" id="afree" style="margin-top:12px"></div>
</div></div>

<div id="app">
  <header>
    <div class="row">
      <select id="ftour"></select>
      <button class="btn" id="dbtn" aria-label="Statistiques">📊</button>
      <button class="btn" id="loc" aria-label="Me localiser">📍</button>
      <button class="btn" id="adm" style="display:none" aria-label="Agents">👥</button>
      <button class="btn" id="out" aria-label="Déconnexion">⎋</button>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <div id="main">
    <div id="map"></div>
    <aside id="dash">
      <div class="row"><h2 id="dtitle">Avancement</h2><button class="btn" id="dclose" style="background:#1f2937">✕</button></div>
      <div class="sub" id="dsub"></div>
      <button class="exp" id="exp">⬇ Exporter en tableur (.xlsx)</button>
      <div class="donut" id="donut"></div>
      <div class="leg" id="leg"></div>
      <div class="kpis" id="kpis"></div>
      <h3 class="sec">Ventes par jour</h3>
      <div id="days"></div>
      <h3 class="sec">Par mode de paiement</h3>
      <div id="modes"></div>
    </aside>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB = supabase.createClient("https://oczxkctqaxfigsfjzoeu.supabase.co", "sb_publishable_KP5UHHZqW4NGj3GFRYJyng_mDwnoikz");
const ST = [
  {k:"a_faire", l:"À faire", c:"#3b82f6"}, {k:"fait", l:"Fait", c:"#16a34a"},
  {k:"repasse", l:"Repassé", c:"#f59e0b"}, {k:"refus", l:"Refus", c:"#dc2626"}];
const meta = k => ST.find(s => s.k === k) || ST[0];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const EUR = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
const SANS = "__sans__", MINE = "__mine__";
const parisDay = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Paris" });
const fmtDay = d => new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit" });
const mine = new Set();
const canEdit = p => isAdmin || (p.tournee && mine.has(p.tournee));
let isAdmin = false, me = "", map, layer, started = false, tournees = [];
const items = new Map(), active = new Set(ST.map(s => s.k));
let queue = []; try { queue = JSON.parse(localStorage.getItem("q3") || "[]"); } catch (e) {}
const saveQ = () => { try { localStorage.setItem("q3", JSON.stringify(queue)); } catch (e) {} };

function toast(t) { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 3500); }

/* ---------- Connexion ---------- */
const DOM = "@calendrier.local";
const toEmail = v => { v = String(v || "").trim().toLowerCase(); return !v || v.includes("@") ? v : v + DOM; };
const who = e => e && e.endsWith(DOM) ? e.slice(0, -DOM.length) : (e || "");
const lmsg = t => $("lmsg").textContent = t;
const authErr = m => /invalid login/i.test(m) ? "Identifiant ou mot de passe incorrect."
  : /signups? not allowed|user not found/i.test(m) ? "Compte inconnu."
  : /rate limit/i.test(m) ? "Trop de tentatives : réessayez dans quelques minutes."
  : "Erreur : " + m;
$("signin").onclick = async () => {
  const email = toEmail($("email").value), password = $("pwd").value;
  if (!email || !password) { lmsg("Entrez votre identifiant et votre mot de passe."); return; }
  lmsg("Connexion…");
  const { error } = await SB.auth.signInWithPassword({ email, password });
  if (error) lmsg(authErr(error.message));
};
$("send").onclick = async () => {
  const email = toEmail($("email").value); if (!email) { lmsg("Entrez votre e-mail."); return; }
  lmsg("Envoi…");
  const { error } = await SB.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } });
  lmsg(error ? authErr(error.message) : "Lien envoyé. Ouvrez votre e-mail sur cet appareil.");
};
[$("email"), $("pwd")].forEach(el => el.addEventListener("keydown", e => { if (e.key === "Enter") $("signin").click(); }));
$("out").onclick = $("wout").onclick = async () => { await SB.auth.signOut(); location.reload(); };
$("wreload").onclick = () => location.reload();
SB.auth.onAuthStateChange((ev, s) => { if (s && !started) start(); });
(async () => {
  const { data } = await SB.auth.getSession();
  if (data.session) start(); else $("login").style.display = "block";
})();

/* ---------- Démarrage ---------- */
async function checkMine() {
  const { data, error } = await SB.from("membres").select("tournee");
  if (error || !data) return;
  const cur = new Set(data.map(m => m.tournee));
  if (cur.size !== mine.size || [...cur].some(t => !mine.has(t))) location.reload();
}
async function start() {
  if (started) return; started = true;
  $("login").style.display = "none";
  const { data: u } = await SB.auth.getUser(); me = u?.user?.email || "";
  await SB.rpc("claim_admin");
  isAdmin = (await SB.rpc("is_admin")).data === true;
  if (isAdmin) $("adm").style.display = "";
  else {
    const { data: ms } = await SB.from("membres").select("tournee");
    (ms || []).forEach(m => mine.add(m.tournee));
    addEventListener("visibilitychange", () => { if (!document.hidden) checkMine(); });
    if (!mine.size) { $("wmail").textContent = me; $("wait").style.display = "block"; setInterval(() => { if (!document.hidden) checkMine(); }, 15000); return; }
  }
  initMap();
  await loadAll();
  flush();
  const touched = pid => { refresh(false); if (openIt && openIt.p.id === pid && !openIt.addOpen) rerender(openIt); };
  SB.channel("live")
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "points" },
      p => { const it = items.get(p.new.id); if (it) { Object.assign(it.p, p.new); restyle(it); touched(it.p.id); } })
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "ventes" },
      p => { ventes.set(p.new.id, normV(p.new)); touched(p.new.point_id); })
    .on("postgres_changes", { event: "DELETE", schema: "public", table: "ventes" },
      p => { const v = ventes.get(p.old.id); ventes.delete(p.old.id); if (v) touched(v.point_id); })
    .subscribe();
}

/* ---------- Position GPS (punaise bleue) ---------- */
const PIN = `<svg width="28" height="38" viewBox="0 0 28 38" xmlns="http://www.w3.org/2000/svg"><path d="M14 1C7 1 1.5 6.4 1.5 13.2 1.5 22 14 37 14 37s12.5-15 12.5-23.8C26.5 6.4 21 1 14 1z" fill="#2563eb" stroke="#fff" stroke-width="2"/><circle cx="14" cy="13" r="5" fill="#fff"/></svg>`;
function initGps() {
  let on = false, first = true, pin = null, halo = null;
  const btn = $("loc");
  const off = () => {
    on = false; map.stopLocate(); btn.classList.remove("on");
    if (pin) { pin.remove(); pin = null; } if (halo) { halo.remove(); halo = null; }
  };
  btn.onclick = () => {
    if (on) { off(); toast("Position désactivée"); return; }
    if (!navigator.geolocation) { toast("Localisation non disponible sur cet appareil"); return; }
    on = true; first = true; btn.classList.add("on"); toast("Recherche de votre position…");
    map.locate({ watch: true, enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
  };
  map.on("locationfound", e => {
    if (!on) return;
    if (!pin) pin = L.marker(e.latlng, { icon: L.divIcon({ className: "gps-pin", html: PIN, iconSize: [28, 38], iconAnchor: [14, 37] }), interactive: false, keyboard: false, zIndexOffset: 2000 }).addTo(map);
    else pin.setLatLng(e.latlng);
    if (e.accuracy < 500) {
      if (!halo) halo = L.circle(e.latlng, { radius: e.accuracy, color: "#2563eb", weight: 1, fillColor: "#2563eb", fillOpacity: .12, interactive: false }).addTo(map);
      else halo.setLatLng(e.latlng).setRadius(e.accuracy);
    }
    if (first) { first = false; map.setView(e.latlng, Math.max(map.getZoom(), 17)); toast("Position activée (±" + Math.round(e.accuracy) + " m)"); }
  });
  map.on("locationerror", e => {
    if (!on) return;
    if (e.code !== 1 && !first) return; // perte de signal passagère : on garde la dernière position
    off();
    toast(e.code === 1 ? "Localisation refusée : autorisez-la dans les réglages du navigateur" : "Position indisponible, réessayez en extérieur");
  });
}

function initMap() {
  map = L.map("map", { zoomControl: false, preferCanvas: true, renderer: L.canvas({ tolerance: 10 }) });
  L.control.zoom({ position: "bottomright" }).addTo(map);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, keepBuffer: 1, updateWhenIdle: true,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
  layer = L.layerGroup().addTo(map);
  map.setView([46.77, 5.62], 13);
  initGps();
  addEventListener("resize", () => map.invalidateSize());
}

async function loadAll() {
  const cols = "id,fid,numero,suffixe,nom_voie,nom_commune,tournee,statut,date_passage,lon,lat,maj_par,maj_le";
  for (let from = 0; ; from += 1000) {
    const { data, error } = await SB.from("points").select(cols).order("id").range(from, from + 999);
    if (error) { toast("Erreur : " + error.message); break; }
    data.forEach(addPoint);
    if (data.length < 1000) break;
  }
  for (let from = 0; ; from += 1000) {
    const { data, error } = await SB.from("ventes").select("id,point_id,montant,mode,jour,par,cree_le").order("cree_le").range(from, from + 999);
    if (error) { toast("Erreur ventes : " + error.message); break; }
    data.forEach(v => ventes.set(v.id, normV(v)));
    if (data.length < 1000) break;
  }
  const t = await SB.from("tournees").select("nom").order("nom");
  tournees = (t.data || []).map(x => x.nom);
  $("ftour").innerHTML = (isAdmin ? "" : `<option value="${MINE}">Mes tournées</option>`) + `<option value="">Toutes les tournées</option>` +
    tournees.map(n => `<option value="${esc(n)}">${!isAdmin && mine.has(n) ? "★ " : ""}${esc(n)}</option>`).join("") + `<option value="${SANS}">(sans tournée)</option>`;
  $("ftour").value = isAdmin ? "" : MINE;
  $("ftour").onchange = () => refresh(true);
  ST.forEach(s => {
    const b = document.createElement("button"); b.className = "chip"; b.dataset.k = s.k; b.style.setProperty("--c", s.c);
    b.onclick = () => toggle(s.k);
    $("chips").appendChild(b);
  });
  refresh(true);
}

const toggle = k => { active.has(k) ? active.delete(k) : active.add(k); refresh(false); };
const sty = p => ({ radius: 10, color: "#fff", weight: 2, fillColor: meta(p.statut).c, fillOpacity: canEdit(p) ? .95 : .5 });
const restyle = it => it.m.setStyle(sty(it.p));

/* Étiquette du numéro de rue, dessinée sur le canvas (léger même avec des milliers de points) */
const LABEL_ZOOM = 17;
const NumMarker = L.CircleMarker.extend({
  _updatePath() {
    L.CircleMarker.prototype._updatePath.call(this);
    if (!this.label || !this._map || this._map.getZoom() < LABEL_ZOOM || this._empty()) return;
    const ctx = this._renderer._ctx, x = this._point.x, y = this._point.y - this._radius - 11;
    ctx.font = "bold 12px system-ui, -apple-system, sans-serif";
    const w = ctx.measureText(this.label).width + 10, h = 18;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x - w / 2, y - h / 2, w, h, 5); else ctx.rect(x - w / 2, y - h / 2, w, h);
    ctx.fillStyle = "rgba(17,24,39,.88)"; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(this.label, x, y + .5);
  }
});
const labelOfPoint = p => p.numero === null || p.numero === undefined ? "" : [p.numero, p.suffixe].filter(v => v !== null && v !== "").join(" ");

const uuid = () => crypto.randomUUID ? crypto.randomUUID()
  : ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
const MODES = [{ k: "especes", l: "Espèces", i: "💶" }, { k: "cheque", l: "Chèque", i: "🧾" }, { k: "cb", l: "CB", i: "💳" }];
const modeOf = k => MODES.find(m => m.k === k) || MODES[0];
const ventes = new Map();
const normV = v => ({ id: v.id, point_id: v.point_id, montant: Number(v.montant), mode: v.mode, jour: v.jour, par: v.par, cree_le: v.cree_le });
const ventesOf = pid => [...ventes.values()].filter(v => v.point_id === pid).sort((a, b) => String(a.cree_le).localeCompare(String(b.cree_le)));
let openIt = null, lastMode = "especes";

function addPoint(p) {
  const m = new NumMarker([p.lat, p.lon], sty(p));
  m.label = labelOfPoint(p);
  const it = { p, m, addOpen: false };
  m.bindPopup(() => popupHtml(it), { minWidth: 240, maxWidth: 300, maxHeight: 440, autoPanPadding: [20, 70] });
  m.on("popupopen", () => { openIt = it; wire(it); });
  m.on("popupclose", () => { if (openIt === it) openIt = null; it.addOpen = false; });
  items.set(p.id, it);
}
const rerender = it => { const pp = it.m.getPopup(); if (pp && pp.isOpen()) { pp.update(); wire(it); } };

const maj0 = p => p.maj_le ? `<div class="sub" style="margin-top:8px">Dernière modification : ${fmtDay(p.date_passage || p.maj_le.slice(0, 10))} · ${esc(who(p.maj_par))}</div>` : "";
function popupHtml(it) {
  const p = it.p, edit = canEdit(p), vs = ventesOf(p.id), tot = vs.reduce((a, v) => a + v.montant, 0), m = meta(p.statut);
  const titre = [p.numero, p.suffixe, p.nom_voie].filter(v => v !== null && v !== undefined && v !== "").join(" ");
  const head = `<div class="top"><div><h3>${esc(titre)}</h3><div class="sub">${esc(p.nom_commune)}${p.tournee ? " · " + esc(p.tournee) : ""}</div></div>` +
    (edit ? `<button class="plus${it.addOpen ? " on" : ""}" id="pl" aria-label="Ajouter une vente">${it.addOpen ? "−" : "＋"}</button>` : "") + `</div>`;
  const form = edit && it.addOpen ? `<div class="vform"><label for="vm">Montant (€)</label><input id="vm" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off">
    <label for="vp">Paiement</label><select id="vp">${MODES.map(x => `<option value="${x.k}"${x.k === lastMode ? " selected" : ""}>${x.i} ${x.l}</option>`).join("")}</select>
    <button class="save" id="vs">Enregistrer la vente</button></div>` : "";
  const list = vs.length ? `<label>Ventes à cette adresse (${vs.length}${vs.length > 1 ? " · " + EUR.format(tot) : ""})</label>` +
    vs.map(v => `<div class="vr"><div><b>${EUR.format(v.montant)}</b> · ${modeOf(v.mode).i} ${modeOf(v.mode).l}<small>${esc(who(v.par))} · ${fmtDay(v.jour)}</small></div>` +
      (edit ? `<button data-del="${v.id}" aria-label="Supprimer la vente">✕</button>` : "") + `</div>`).join("") : "";
  const stat = edit
    ? `<label for="st">Statut</label><select id="st" style="--c:${m.c}">${ST.map(s => `<option value="${s.k}"${s.k === p.statut ? " selected" : ""}>${s.l}</option>`).join("")}</select>`
    : `<div style="margin-top:8px"><span class="dot" style="background:${m.c};display:inline-block;vertical-align:-1px"></span> <b>${m.l}</b></div>`;
  return `<div class="pop">${head}${form}${list}${stat}${maj0(p)}${edit ? "" : '<div class="sub" style="margin-top:6px">Lecture seule : cette tournée ne vous est pas affectée.</div>'}</div>`;
}

function wire(it) {
  const pp = it.m.getPopup(), el = pp && pp.getElement(); if (!el) return;
  const pl = el.querySelector("#pl"); if (!pl) return; // lecture seule
  pl.onclick = e => { e.stopPropagation(); it.addOpen = !it.addOpen; rerender(it); const i = it.addOpen && it.m.getPopup().getElement().querySelector("#vm"); if (i) i.focus(); };
  const st = el.querySelector("#st"); st.onchange = () => setStatut(it, st.value);
  const vs = el.querySelector("#vs");
  if (vs) vs.onclick = e => {
    e.stopPropagation();
    const raw = el.querySelector("#vm").value.trim().replace(/\s/g, "").replace(",", "."), montant = Number(raw);
    if (!raw || !isFinite(montant) || montant <= 0 || montant >= 10000) { toast("Montant invalide (entre 0,01 et 9 999,99)"); return; }
    addVente(it, Math.round(montant * 100) / 100, el.querySelector("#vp").value);
  };
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Supprimer ?"; setTimeout(() => { b.classList.remove("armed"); b.textContent = "✕"; }, 4000); return; }
    delVente(it, b.dataset.del);
  });
}

/* ---------- Saisie + file d'attente hors-ligne ---------- */
function setStatut(it, statut) {
  if (!canEdit(it.p)) { toast("Tournée non affectée"); return; }
  Object.assign(it.p, { statut, date_passage: parisDay(), maj_le: new Date().toISOString(), maj_par: me });
  queue = queue.filter(q => !(q.k === "statut" && q.id === it.p.id)); queue.push({ k: "statut", id: it.p.id, statut }); saveQ();
  restyle(it); refresh(false); rerender(it); flush();
}
function addVente(it, montant, mode) {
  if (!canEdit(it.p)) { toast("Tournée non affectée"); return; }
  lastMode = mode;
  const v = { id: uuid(), point_id: it.p.id, montant, mode, jour: parisDay(), par: me, cree_le: new Date().toISOString() };
  ventes.set(v.id, v);
  Object.assign(it.p, { statut: "fait", date_passage: v.jour, maj_le: v.cree_le, maj_par: me }); // une vente passe le point à « fait »
  queue = queue.filter(q => !(q.k === "statut" && q.id === it.p.id));
  queue.push({ k: "vente", id: v.id, point: it.p.id, montant, mode }); saveQ();
  restyle(it); refresh(false); rerender(it); flush(); toast("Vente ajoutée : " + EUR.format(montant));
}
function delVente(it, id) {
  ventes.delete(id);
  const waiting = queue.some(q => q.k === "vente" && q.id === id && q !== flush.cur);
  queue = queue.filter(q => !(q.k === "vente" && q.id === id && q !== flush.cur));
  if (!waiting) queue.push({ k: "del", id });
  saveQ(); refresh(false); rerender(it); flush();
}
async function flush() {
  if (flush.busy) return; flush.busy = true;
  while (queue.length) {
    const q = flush.cur = queue[0];
    const { error } = await (q.k === "statut" ? SB.rpc("set_statut", { p_id: q.id, p_statut: q.statut })
      : q.k === "vente" ? SB.rpc("ajouter_vente", { p_id: q.id, p_point: q.point, p_montant: q.montant, p_mode: q.mode })
      : SB.rpc("supprimer_vente", { p_id: q.id }));
    flush.cur = null;
    if (error && (!navigator.onLine || /fetch|network/i.test(error.message))) { toast("Hors-ligne : modification en attente"); break; }
    if (error) { toast("Refusé : " + error.message); if (q.k === "vente") { ventes.delete(q.id); refresh(false); if (openIt) rerender(openIt); } }
    const i = queue.indexOf(q); if (i >= 0) queue.splice(i, 1); saveQ();
  }
  flush.cur = null; flush.busy = false;
}
addEventListener("online", flush);

/* ---------- Filtre + tableau de bord ---------- */
const inFilter = (p, f) => !f || (f === SANS ? !p.tournee : f === MINE ? mine.has(p.tournee) : p.tournee === f);

function refresh(fit) {
  const f = $("ftour").value, pts = [];
  items.forEach(it => {
    const show = inFilter(it.p, f) && active.has(it.p.statut);
    if (show) { if (!layer.hasLayer(it.m)) layer.addLayer(it.m); pts.push(it.m.getLatLng()); } else layer.removeLayer(it.m);
  });
  dashboard(f);
  if (fit && pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [30, 30] });
}

const labelOf = f => f === SANS ? "Sans tournée" : f === MINE ? "Mes tournées" : f || "Toutes les tournées";
function dashboard(f) {
  const n = {}; ST.forEach(s => n[s.k] = 0); let total = 0;
  items.forEach(({ p }) => { if (!inFilter(p, f)) return; total++; n[p.statut]++; });
  const days = new Map(), modes = {}; MODES.forEach(m => modes[m.k] = { n: 0, s: 0 });
  let sumF = 0, nbF = 0, sumAll = 0;
  ventes.forEach(v => {
    const it = items.get(v.point_id); if (!it) return;
    sumAll += v.montant;
    if (!inFilter(it.p, f)) return;
    sumF += v.montant; nbF++;
    const d = days.get(v.jour) || { n: 0, sum: 0 }; d.n++; d.sum += v.montant; days.set(v.jour, d);
    const md = modes[v.mode]; if (md) { md.n++; md.s += v.montant; }
  });
  ST.forEach(s => { const b = document.querySelector(`.chip[data-k="${s.k}"]`); if (b) { b.textContent = `${s.l} ${n[s.k]}`; b.classList.toggle("on", active.has(s.k)); } });

  const label = labelOf(f);
  $("dtitle").textContent = label;
  $("dsub").textContent = `${total} points`;

  // donut
  const R = 56, C = 2 * Math.PI * R; let off = 0;
  const segs = ST.map(s => {
    const len = total ? n[s.k] / total * C : 0;
    const el = `<circle class="seg${active.has(s.k) ? "" : " off"}" data-k="${s.k}" r="${R}" cx="70" cy="70" fill="none" stroke="${s.c}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"></circle>`;
    off += len; return el;
  }).join("");
  const pct = total ? Math.round((total - n.a_faire) / total * 100) : 0;
  $("donut").innerHTML = `<svg viewBox="0 0 140 140"><circle r="${R}" cx="70" cy="70" fill="none" stroke="#e5e7eb" stroke-width="22"/>${segs}</svg>
    <div class="dc"><b>${pct}%</b><span>traités</span></div>`;
  $("donut").querySelectorAll(".seg").forEach(c => c.onclick = () => toggle(c.dataset.k));

  $("leg").innerHTML = ST.map(s => `<button data-k="${s.k}" class="${active.has(s.k) ? "" : "off"}"><span class="dot" style="background:${s.c}"></span>${s.l}
    <span class="n">${n[s.k]}</span><span class="p">${total ? Math.round(n[s.k] / total * 100) : 0} %</span></button>`).join("");
  $("leg").querySelectorAll("button").forEach(b => b.onclick = () => toggle(b.dataset.k));

  $("kpis").innerHTML = `<div class="kpi"><b>${EUR.format(sumF)}</b><span>${f ? "Total " + esc(label) : "Total global"}</span></div>
    <div class="kpi"><b>${f ? EUR.format(sumAll) : nbF}</b><span>${f ? "Total global" : "ventes"}</span></div>`;

  // ventes par jour
  const rows = [...days.entries()].sort((a, b) => b[0].localeCompare(a[0]));
  const max = Math.max(1, ...rows.map(([, d]) => d.sum));
  $("days").innerHTML = rows.length
    ? rows.map(([d, v]) => `<div class="day"><span>${fmtDay(d)}</span><div class="bar"><i style="width:${Math.max(3, v.sum / max * 100)}%"></i></div>
        <span class="v">${EUR.format(v.sum)}<small>${v.n} vente${v.n > 1 ? "s" : ""}</small></span></div>`).join("") +
      `<div class="tot"><span>Total${f ? " · " + esc(label) : ""} (${nbF})</span><span>${EUR.format(sumF)}</span></div>`
    : `<div class="empty">Aucune vente pour le moment.</div><div class="tot"><span>Total</span><span>${EUR.format(0)}</span></div>`;

  // modes de paiement
  $("modes").innerHTML = MODES.map(m => `<div class="mo"><span>${m.i} ${m.l}</span><span>${EUR.format(modes[m.k].s)}<small>${modes[m.k].n} vente${modes[m.k].n > 1 ? "s" : ""}</small></span></div>`).join("");
}

/* ---------- Export tableur ---------- */
const loadXlsx = () => window.XLSX ? Promise.resolve() : new Promise((ok, ko) => {
  const sc = document.createElement("script");
  sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; sc.onload = ok; sc.onerror = ko; document.head.appendChild(sc);
});
$("exp").onclick = async () => {
  const f = $("ftour").value, label = labelOf(f);
  const cmp = (a, b) => String(a ?? "").localeCompare(String(b ?? ""), "fr", { numeric: true });
  const pts = [...items.values()].map(i => i.p).filter(p => inFilter(p, f))
    .sort((a, b) => cmp(a.tournee, b.tournee) || cmp(a.nom_commune, b.nom_commune) || cmp(a.nom_voie, b.nom_voie) || cmp(a.numero, b.numero) || cmp(a.suffixe, b.suffixe));
  const ids = new Set(pts.map(p => p.id)), r2 = x => Math.round(x * 100) / 100;
  const adr = p => [p.numero, p.suffixe, p.nom_voie].filter(v => v !== null && v !== undefined && v !== "").join(" ");
  const dt = d => d ? new Date(d + "T12:00:00") : "";
  const vs = [...ventes.values()].filter(v => ids.has(v.point_id)).sort((a, b) => a.jour.localeCompare(b.jour) || String(a.cree_le).localeCompare(String(b.cree_le)));
  const perPt = new Map(), jours = new Map();
  vs.forEach(v => {
    const x = perPt.get(v.point_id) || { n: 0, s: 0 }; x.n++; x.s += v.montant; perPt.set(v.point_id, x);
    const j = jours.get(v.jour) || { n: 0, t: 0, especes: 0, cheque: 0, cb: 0 }; j.n++; j.t += v.montant; j[v.mode] += v.montant; jours.set(v.jour, j);
  });
  const head = ["Tournée", "Commune", "Numéro", "Suffixe", "Voie", "Statut", "Nb ventes", "Montant total (€)", "Date dernière modification", "Modifié par", "Latitude", "Longitude"];
  const rows = pts.map(p => { const x = perPt.get(p.id);
    return [p.tournee || "", p.nom_commune || "", p.numero ?? "", p.suffixe || "", p.nom_voie || "", meta(p.statut).l, x ? x.n : 0, x ? r2(x.s) : "", dt(p.date_passage), who(p.maj_par), p.lat, p.lon]; });
  const vhead = ["Date", "Tournée", "Commune", "Adresse", "Montant (€)", "Mode de paiement", "Vendu par"];
  const vrows = vs.map(v => { const p = items.get(v.point_id).p; return [dt(v.jour), p.tournee || "", p.nom_commune || "", adr(p), v.montant, modeOf(v.mode).l, who(v.par)]; });
  const jhead = ["Date", "Ventes", "Montant (€)", "Espèces (€)", "Chèque (€)", "CB (€)"];
  const jrows = [...jours.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([d, v]) => [dt(d), v.n, r2(v.t), r2(v.especes), r2(v.cheque), r2(v.cb)]);
  const T = k => r2(vs.reduce((a, v) => a + (k === "t" ? v.montant : v.mode === k ? v.montant : 0), 0));
  jrows.push(["Total", vs.length, T("t"), T("especes"), T("cheque"), T("cb")]);
  const nom = `calendrier_2026_${label.replace(/[^\w-]+/g, "_")}_${parisDay()}`;
  try {
    await loadXlsx();
    const mk = (aoa, widths, dateCols, moneyCols) => {
      const ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates: true });
      for (let r = 1; r < aoa.length; r++) {
        dateCols.forEach(c => { const x = ws[XLSX.utils.encode_cell({ r, c })]; if (x && x.t === "d") x.z = "dd/mm/yyyy"; });
        moneyCols.forEach(c => { const x = ws[XLSX.utils.encode_cell({ r, c })]; if (x && x.t === "n") x.z = "#,##0.00"; });
      }
      ws["!cols"] = widths.map(w => ({ wch: w }));
      ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(aoa.length - 1, 0), c: aoa[0].length - 1 } }) };
      return ws;
    };
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, mk([head, ...rows], [14, 20, 8, 8, 30, 10, 10, 16, 22, 16, 11, 11], [8], [7]), "Points");
    XLSX.utils.book_append_sheet(wb, mk([vhead, ...vrows], [12, 14, 20, 34, 12, 18, 16], [0], [4]), "Ventes");
    XLSX.utils.book_append_sheet(wb, mk([jhead, ...jrows], [12, 8, 13, 13, 13, 13], [0], [2, 3, 4, 5]), "Par jour");
    XLSX.writeFile(wb, nom + ".xlsx", { cellDates: true });
  } catch (e) {
    // hors-ligne : repli en CSV des ventes (ouvrable dans Excel / LibreOffice)
    const fmt = v => v instanceof Date ? v.toLocaleDateString("fr-FR") : typeof v === "number" ? String(v).replace(".", ",") : v;
    const csv = [vhead, ...vrows].map(r => r.map(v => `"${String(fmt(v)).replace(/"/g, '""')}"`).join(";")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" })); a.download = nom + "_ventes.csv"; a.click();
    toast("Hors-ligne : export CSV des ventes");
  }
};

$("dbtn").onclick = () => $("dash").classList.add("open");

/* ---------- Administration : une tournée = un binôme ---------- */
const adm = { users: [], owner: new Map(), onlyFree: false };
const natural = (a, b) => String(a).localeCompare(String(b), "fr", { numeric: true });
$("adm").onclick = async () => { $("panel").style.display = "block"; await loadAdmin(); };
$("pclose").onclick = () => $("panel").style.display = "none";
async function loadAdmin() {
  const [u, m] = await Promise.all([SB.from("utilisateurs").select("email,role"), SB.from("membres").select("email,tournee")]);
  const users = new Set((u.data || []).filter(x => x.role !== "admin").map(x => x.email));
  (m.data || []).forEach(x => users.add(x.email));
  adm.users = [...users].sort((a, b) => natural(who(a), who(b)));
  adm.owner = new Map((m.data || []).map(x => [x.tournee, x.email]));
  renderAdmin();
}
function renderAdmin() {
  const cnt = new Map(); adm.owner.forEach(e => cnt.set(e, (cnt.get(e) || 0) + 1));
  const st = new Map();
  items.forEach(({ p }) => { if (!p.tournee) return; const v = st.get(p.tournee) || { n: 0, d: 0 }; v.n++; if (p.statut !== "a_faire") v.d++; st.set(p.tournee, v); });
  const all = [...tournees].sort(natural), free = all.filter(t => !adm.owner.has(t));
  $("asum").textContent = `${all.length} tournées · ${all.length - free.length} affectées · ${free.length} sans binôme`;
  $("af_all").classList.toggle("on", !adm.onlyFree); $("af_free").classList.toggle("on", adm.onlyFree);
  const top = $("panel").scrollTop;
  $("alist").innerHTML = (adm.onlyFree ? free : all).map(t => {
    const cur = adm.owner.get(t), v = st.get(t) || { n: 0, d: 0 };
    const opts = `<option value="">— sans binôme —</option>` + adm.users.map(e =>
      `<option value="${esc(e)}"${e === cur ? " selected" : ""}>${esc(who(e))} (${cnt.get(e) || 0})</option>`).join("");
    return `<div class="ar${cur ? "" : " free"}"><div><b>${esc(t)}</b><small>${v.n} pts · ${v.n ? Math.round(v.d / v.n * 100) : 0} % traités</small></div>
      <select data-t="${esc(t)}">${opts}</select></div>`;
  }).join("") || '<div class="msg">Toutes les tournées ont un binôme.</div>';
  $("alist").querySelectorAll("select").forEach(sel => sel.onchange = () => affecter(sel.dataset.t, sel.value));
  const idle = adm.users.filter(e => !cnt.has(e));
  $("afree").textContent = idle.length ? `Binômes sans tournée (${idle.length}) : ${idle.map(who).join(", ")}` : "Tous les binômes ont au moins une tournée.";
  $("panel").scrollTop = top;
}
async function affecter(t, email) {
  const { error } = await SB.rpc("affecter_tournee", { p_tournee: t, p_email: email || null });
  if (error) { toast(error.message); await loadAdmin(); return; }
  if (email) adm.owner.set(t, email); else adm.owner.delete(t);
  renderAdmin(); toast(`${t} → ${email ? who(email) : "sans binôme"}`);
}
let armed = null;
function disarm() { if (!armed) return; clearTimeout(armed.t); armed.btn.textContent = armed.btn.dataset.l; armed.btn.classList.remove("armed"); armed = null; }
function arm(btn, label, fn) {
  if (armed && armed.btn === btn) { disarm(); fn(); return; }   // second appui = confirmation
  disarm(); btn.dataset.l = btn.dataset.l || btn.textContent; btn.textContent = label; btn.classList.add("armed");
  armed = { btn, t: setTimeout(disarm, 6000) };
}
$("a_rep").onclick = () => {
  if (!isAdmin) return;
  const free = tournees.filter(t => !adm.owner.has(t)).length;
  const taken = new Set(adm.owner.values()), idle = adm.users.filter(e => !taken.has(e)).length;
  if (!free) { toast("Toutes les tournées ont déjà un binôme"); return; }
  if (!idle) { toast("Aucun binôme sans tournée : rien à répartir"); return; }
  arm($("a_rep"), `Confirmer : ${free} tournée${free > 1 ? "s" : ""} → ${idle} binôme${idle > 1 ? "s" : ""} ?`, async () => {
    const { data, error } = await SB.rpc("repartir_tournees");
    if (error) toast(error.message); else toast(`${data} tournée${data > 1 ? "s" : ""} réparties`);
    await loadAdmin();
  });
};
$("a_clear").onclick = () => {
  if (!isAdmin) return;
  if (!adm.owner.size) { toast("Aucune affectation à retirer"); return; }
  arm($("a_clear"), `Confirmer : retirer les ${adm.owner.size} affectation${adm.owner.size > 1 ? "s" : ""} ?`, async () => {
    const { error } = await SB.rpc("retirer_affectations");
    if (error) toast(error.message); else toast("Toutes les affectations ont été retirées");
    await loadAdmin();
  });
};
