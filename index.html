<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2937">
<title>Calendrier 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--bar:#1f2937;--bg:#f3f4f6}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
#app{display:flex;flex-direction:column;height:100%}
header{background:var(--bar);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;z-index:1600;position:relative}
.row{display:flex;gap:6px;align-items:center;justify-content:space-between}
header select{flex:1;min-width:0;font-size:14px;padding:6px;border-radius:8px;border:0}
.btn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:14px}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.chip{flex:none;border:2px solid var(--c);color:#fff;background:transparent;border-radius:999px;padding:4px 10px;font-size:13px}
.chip.on{background:var(--c)}
#main{flex:1;min-height:0;display:flex}
#map{flex:1;min-width:0}
#dash{width:340px;flex:none;background:#fff;border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px 20px}
#dash h2{margin:0;font-size:16px}
#dash .sub{color:var(--mut);font-size:12.5px}
#dclose{display:none}
#dbtn{display:none}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.kpi{background:var(--bg);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mut)}
.donut{position:relative;width:170px;height:170px;margin:12px auto 6px}
.donut svg{width:100%;height:100%}
.donut circle.seg{cursor:pointer;transition:opacity .15s}
.donut circle.seg.off{opacity:.18}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dc b{font-size:28px;line-height:1}
.dc span{font-size:12px;color:var(--mut)}
.leg{display:grid;gap:2px}
.leg button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:5px 2px;font-size:14px;text-align:left;border-radius:6px}
.leg button.off{opacity:.4}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.leg .n{margin-left:auto;font-variant-numeric:tabular-nums}
.leg .p{width:42px;text-align:right;color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums}
h3.sec{margin:18px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.day{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;padding:4px 0;font-size:13.5px}
.day .bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.day .bar i{display:block;height:100%;background:#16a34a;border-radius:4px}
.day .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.day .v small{display:block;color:var(--mut);font-size:11.5px}
.tot{display:flex;justify-content:space-between;border-top:2px solid var(--ink);margin-top:8px;padding-top:8px;font-weight:600;font-variant-numeric:tabular-nums}
.empty{color:var(--mut);font-size:13px;padding:8px 0}
#login,#panel,#wait{position:fixed;inset:0;background:var(--bg);z-index:2000;display:none;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px 20px;overflow:auto}
.card{max-width:420px;margin:0 auto;background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.card input,.card select{width:100%;font-size:16px;padding:10px;border:1px solid #d1d5db;border-radius:8px;margin:6px 0}
.card button.go{width:100%;font-size:16px;padding:11px;border:0;border-radius:8px;background:var(--bar);color:#fff;margin-top:6px}
.pend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.pend button{border:1px dashed #9ca3af;background:#fff;border-radius:999px;padding:4px 10px;font-size:13px}
.lnk{display:block;width:100%;background:none;border:0;color:#2563eb;font-size:14px;margin-top:10px;padding:6px}
.msg{font-size:13px;color:var(--mut);margin-top:8px}
.mb{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:6px 0;font-size:13px}
.mb button{border:0;background:none;color:#dc2626;font-size:16px}
.leaflet-popup-content{margin:12px 14px;min-width:220px}
.leaflet-popup-content h3{margin:0 0 2px;font-size:16px}
.pop .sub{color:var(--mut);font-size:13px}
.pop label{display:block;color:var(--mut);font-size:12.5px;margin-top:8px}
.pop select,.pop input{width:100%;font-size:16px;padding:8px;border-radius:8px;border:2px solid #d1d5db;background:#fff;margin:2px 0}
.pop select{border-color:var(--c,#999)}
.pop .save{width:100%;margin-top:8px;font-size:16px;padding:10px;border:0;border-radius:8px;background:var(--bar);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;z-index:3000;display:none;max-width:90vw}
@media (max-width:899px){
  #dbtn{display:inline-block}
  #dclose{display:inline-block}
  #dash{position:fixed;top:0;right:0;bottom:0;width:min(92vw,380px);z-index:1700;transform:translateX(100%);transition:transform .2s;box-shadow:-4px 0 16px rgba(0,0,0,.2);padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
  #dash.open{transform:none}
}
</style>
</head>
<body>
<div id="login"><div class="card">
  <h2 style="margin-top:0">Calendrier 2026</h2>
  <p class="sub">Connectez-vous ou créez votre compte en quelques secondes.</p>
  <input id="email" type="email" placeholder="prenom.nom@exemple.fr" autocomplete="email">
  <input id="pwd" type="password" placeholder="Mot de passe (8 caractères minimum)" autocomplete="current-password">
  <button class="go" id="signin">Se connecter</button>
  <button class="go" id="signup" style="background:#fff;color:#1f2937;border:2px solid #1f2937">Créer mon compte</button>
  <button class="lnk" id="send">Recevoir un lien de connexion par e-mail</button>
  <div class="msg" id="lmsg"></div>
</div></div>

<div id="wait"><div class="card">
  <h2 style="margin-top:0">Compte créé</h2>
  <p>Votre compte n'a pas encore de tournée. Un administrateur doit vous en affecter une : vous aurez alors accès à la carte.</p>
  <p class="sub" id="wmail"></p>
  <button class="go" id="wreload">Actualiser</button>
  <button class="go" id="wout" style="background:#6b7280">Se déconnecter</button>
</div></div>

<div id="panel"><div class="card">
  <div class="row"><h3 style="margin:0">Agents et tournées</h3><button class="btn" style="background:#1f2937" id="pclose">Fermer</button></div>
  <div class="msg" style="margin-top:12px">En attente d'affectation :</div><div class="pend" id="mpend"></div>
  <input id="memail" type="email" placeholder="e-mail de l'agent">
  <select id="mtour"></select>
  <button class="go" id="madd">Affecter</button>
  <div id="mlist" style="margin-top:12px"></div>
</div></div>

<div id="app">
  <header>
    <div class="row">
      <select id="ftour"></select>
      <button class="btn" id="dbtn" aria-label="Statistiques">📊</button>
      <button class="btn" id="loc" aria-label="Me localiser">📍</button>
      <button class="btn" id="adm" style="display:none" aria-label="Agents">👥</button>
      <button class="btn" id="out" aria-label="Déconnexion">⎋</button>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <div id="main">
    <div id="map"></div>
    <aside id="dash">
      <div class="row"><h2 id="dtitle">Avancement</h2><button class="btn" id="dclose" style="background:#1f2937">✕</button></div>
      <div class="sub" id="dsub"></div>
      <div class="donut" id="donut"></div>
      <div class="leg" id="leg"></div>
      <div class="kpis" id="kpis"></div>
      <h3 class="sec">Saisie par jour</h3>
      <div id="days"></div>
    </aside>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB = supabase.createClient("https://oczxkctqaxfigsfjzoeu.supabase.co", "sb_publishable_KP5UHHZqW4NGj3GFRYJyng_mDwnoikz");
const ST = [
  {k:"a_faire", l:"À faire", c:"#3b82f6"}, {k:"fait", l:"Fait", c:"#16a34a"},
  {k:"repasse", l:"Repassé", c:"#f59e0b"}, {k:"refus", l:"Refus", c:"#dc2626"}];
const meta = k => ST.find(s => s.k === k) || ST[0];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const EUR = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
const SANS = "__sans__", MINE = "__mine__";
const parisDay = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Paris" });
const fmtDay = d => new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit" });
const mine = new Set();
const canEdit = p => isAdmin || (p.tournee && mine.has(p.tournee));
let isAdmin = false, me = "", map, layer, started = false, tournees = [];
const items = new Map(), active = new Set(ST.map(s => s.k));
let queue = []; try { queue = JSON.parse(localStorage.getItem("q2") || "[]"); } catch (e) {}
const saveQ = () => { try { localStorage.setItem("q2", JSON.stringify(queue)); } catch (e) {} };

function toast(t) { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 3500); }

/* ---------- Connexion ---------- */
const lmsg = t => $("lmsg").textContent = t;
const creds = () => {
  const email = $("email").value.trim(), password = $("pwd").value;
  if (!email) { lmsg("Entrez votre e-mail."); return null; }
  return { email, password };
};
const authErr = m => /signups? not allowed/i.test(m) ? "Les inscriptions sont fermées : demandez à l'administrateur de les ouvrir."
  : /invalid login/i.test(m) ? "E-mail ou mot de passe incorrect."
  : /not confirmed/i.test(m) ? "Adresse non confirmée : cliquez sur le lien reçu par e-mail."
  : /rate limit/i.test(m) ? "Trop de tentatives : réessayez dans quelques minutes."
  : "Erreur : " + m;
$("signin").onclick = async () => {
  const c = creds(); if (!c) return;
  if (!c.password) { lmsg("Entrez votre mot de passe."); return; }
  lmsg("Connexion…");
  const { error } = await SB.auth.signInWithPassword(c);
  if (error) lmsg(authErr(error.message));
};
$("signup").onclick = async () => {
  const c = creds(); if (!c) return;
  if (c.password.length < 8) { lmsg("Choisissez un mot de passe d'au moins 8 caractères."); return; }
  lmsg("Création du compte…");
  const { data, error } = await SB.auth.signUp({ ...c, options: { emailRedirectTo: location.origin + location.pathname } });
  if (error) { lmsg(authErr(error.message)); return; }
  if (data.user && data.user.identities && data.user.identities.length === 0) { lmsg("Ce compte existe déjà : utilisez « Se connecter »."); return; }
  if (!data.session) lmsg("Compte créé. Un e-mail de confirmation vous a été envoyé : cliquez sur son lien, puis connectez-vous.");
};
$("send").onclick = async () => {
  const email = $("email").value.trim(); if (!email) { lmsg("Entrez votre e-mail."); return; }
  lmsg("Envoi…");
  const { error } = await SB.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
  lmsg(error ? authErr(error.message) : "Lien envoyé. Ouvrez votre e-mail sur cet appareil.");
};
[$("email"), $("pwd")].forEach(el => el.addEventListener("keydown", e => { if (e.key === "Enter") $("signin").click(); }));
$("out").onclick = $("wout").onclick = async () => { await SB.auth.signOut(); location.reload(); };
$("wreload").onclick = () => location.reload();
SB.auth.onAuthStateChange((ev, s) => { if (s && !started) start(); });
(async () => {
  const { data } = await SB.auth.getSession();
  if (data.session) start(); else $("login").style.display = "block";
})();

/* ---------- Démarrage ---------- */
async function start() {
  if (started) return; started = true;
  $("login").style.display = "none";
  const { data: u } = await SB.auth.getUser(); me = u?.user?.email || "";
  await SB.rpc("claim_admin");
  isAdmin = (await SB.rpc("is_admin")).data === true;
  if (isAdmin) $("adm").style.display = "";
  else {
    const { data: ms } = await SB.from("membres").select("tournee");
    (ms || []).forEach(m => mine.add(m.tournee));
    if (!mine.size) { $("wmail").textContent = me; $("wait").style.display = "block"; return; }
  }
  initMap();
  await loadAll();
  flush();
  SB.channel("pts").on("postgres_changes", { event: "UPDATE", schema: "public", table: "points" },
    p => { const it = items.get(p.new.id); if (it) { Object.assign(it.p, p.new); restyle(it); refresh(false); } }).subscribe();
}

function initMap() {
  map = L.map("map", { zoomControl: false, preferCanvas: true, renderer: L.canvas({ tolerance: 10 }) });
  L.control.zoom({ position: "bottomright" }).addTo(map);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, keepBuffer: 1, updateWhenIdle: true,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
  layer = L.layerGroup().addTo(map);
  map.setView([46.77, 5.62], 13);
  $("loc").onclick = () => map.locate({ setView: true, maxZoom: 17 });
  addEventListener("resize", () => map.invalidateSize());
}

async function loadAll() {
  const cols = "id,fid,numero,suffixe,nom_voie,nom_commune,tournee,statut,montant,date_passage,lon,lat,maj_par,maj_le";
  for (let from = 0; ; from += 1000) {
    const { data, error } = await SB.from("points").select(cols).order("id").range(from, from + 999);
    if (error) { toast("Erreur : " + error.message); break; }
    data.forEach(addPoint);
    if (data.length < 1000) break;
  }
  const t = await SB.from("tournees").select("nom").order("nom");
  tournees = (t.data || []).map(x => x.nom);
  $("ftour").innerHTML = (isAdmin ? "" : `<option value="${MINE}">Mes tournées</option>`) + `<option value="">Toutes les tournées</option>` +
    tournees.map(n => `<option value="${esc(n)}">${!isAdmin && mine.has(n) ? "★ " : ""}${esc(n)}</option>`).join("") + `<option value="${SANS}">(sans tournée)</option>`;
  $("ftour").value = isAdmin ? "" : MINE;
  $("ftour").onchange = () => refresh(true);
  ST.forEach(s => {
    const b = document.createElement("button"); b.className = "chip"; b.dataset.k = s.k; b.style.setProperty("--c", s.c);
    b.onclick = () => toggle(s.k);
    $("chips").appendChild(b);
  });
  refresh(true);
}

const toggle = k => { active.has(k) ? active.delete(k) : active.add(k); refresh(false); };
const sty = p => ({ radius: 10, color: "#fff", weight: 2, fillColor: meta(p.statut).c, fillOpacity: canEdit(p) ? .95 : .5 });
const restyle = it => it.m.setStyle(sty(it.p));

function addPoint(p) {
  const m = L.circleMarker([p.lat, p.lon], sty(p));
  const it = { p, m };
  m.bindPopup(() => popup(it), { maxWidth: 300, autoPanPadding: [20, 70] });
  m.on("popupopen", e => {
    const el = e.popup.getElement(), s = el.querySelector("#st"), mt = el.querySelector("#mt");
    if (!s) return;
    s.onchange = () => s.style.setProperty("--c", meta(s.value).c);
    el.querySelector("#sv").onclick = () => {
      const raw = mt.value.trim().replace(/\s/g, "").replace(",", ".");
      const montant = raw === "" ? null : Number(raw);
      if (montant !== null && (!isFinite(montant) || montant < 0 || montant >= 100000)) { toast("Montant invalide"); return; }
      save(it, s.value, montant === null ? null : Math.round(montant * 100) / 100);
      m.closePopup();
    };
  });
  items.set(p.id, it);
}

const maj0 = p => p.maj_le ? `<div class="sub" style="margin-top:8px">Dernière modification : ${fmtDay(p.date_passage || p.maj_le.slice(0, 10))} · ${esc(p.maj_par)}</div>` : "";
function popup(it) {
  const p = it.p;
  const titre = [p.numero, p.suffixe, p.nom_voie].filter(v => v !== null && v !== "").join(" ");
  if (!canEdit(p)) {
    const m = meta(p.statut);
    return `<div class="pop"><h3>${esc(titre)}</h3><div class="sub">${esc(p.nom_commune)}${p.tournee ? " · " + esc(p.tournee) : ""}</div>
      <div style="margin-top:8px"><span class="dot" style="background:${m.c};display:inline-block;vertical-align:-1px"></span> <b>${m.l}</b></div>
      <div>Montant : <b>${p.montant === null || p.montant === undefined ? "—" : EUR.format(p.montant)}</b></div>
      ${maj0(p)}<div class="sub" style="margin-top:6px">Lecture seule : cette tournée ne vous est pas affectée.</div></div>`;
  }
  const opts = ST.map(s => `<option value="${s.k}"${s.k === p.statut ? " selected" : ""}>${s.l}</option>`).join("");
  const maj = p.maj_le ? `<div class="sub" style="margin-top:8px">Dernière modification : ${fmtDay(p.date_passage || p.maj_le.slice(0, 10))} · ${esc(p.maj_par)}</div>` : "";
  return `<div class="pop"><h3>${esc(titre)}</h3><div class="sub">${esc(p.nom_commune)}${p.tournee ? " · " + esc(p.tournee) : ""}</div>
    <label for="st">Statut</label><select id="st" style="--c:${meta(p.statut).c}">${opts}</select>
    <label for="mt">Montant (€)</label><input id="mt" type="text" inputmode="decimal" placeholder="0,00" value="${p.montant === null || p.montant === undefined ? "" : String(p.montant).replace(".", ",")}">
    <button class="save" id="sv">Enregistrer</button>${maj}</div>`;
}

/* ---------- Saisie + file d'attente hors-ligne ---------- */
function save(it, statut, montant) {
  if (!canEdit(it.p)) { toast("Tournée non affectée"); return; }
  Object.assign(it.p, { statut, montant, date_passage: parisDay(), maj_le: new Date().toISOString(), maj_par: me });
  restyle(it); refresh(false);
  queue = queue.filter(q => q.id !== it.p.id); queue.push({ id: it.p.id, statut, montant }); saveQ(); flush();
}
async function flush() {
  if (flush.busy) return; flush.busy = true;
  while (queue.length) {
    const q = queue[0];
    const { error } = await SB.rpc("set_saisie", { p_id: q.id, p_statut: q.statut, p_montant: q.montant });
    if (error && (!navigator.onLine || /fetch|network/i.test(error.message))) { toast("Hors-ligne : modification en attente"); break; }
    if (error) toast("Refusé : " + error.message);
    queue.shift(); saveQ();
  }
  flush.busy = false;
}
addEventListener("online", flush);

/* ---------- Filtre + tableau de bord ---------- */
const inFilter = (p, f) => !f || (f === SANS ? !p.tournee : f === MINE ? mine.has(p.tournee) : p.tournee === f);

function refresh(fit) {
  const f = $("ftour").value, pts = [];
  items.forEach(it => {
    const show = inFilter(it.p, f) && active.has(it.p.statut);
    if (show) { if (!layer.hasLayer(it.m)) layer.addLayer(it.m); pts.push(it.m.getLatLng()); } else layer.removeLayer(it.m);
  });
  dashboard(f);
  if (fit && pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [30, 30] });
}

function dashboard(f) {
  const n = {}; ST.forEach(s => n[s.k] = 0);
  const days = new Map(); let total = 0, sumF = 0, sumAll = 0;
  items.forEach(({ p }) => {
    const done = p.statut !== "a_faire" && p.date_passage;
    const m = Number(p.montant) || 0;
    if (done) sumAll += m;
    if (!inFilter(p, f)) return;
    total++; n[p.statut]++;
    if (done) {
      sumF += m;
      const d = days.get(p.date_passage) || { n: 0, sum: 0 }; d.n++; d.sum += m; days.set(p.date_passage, d);
    }
  });
  ST.forEach(s => { const b = document.querySelector(`.chip[data-k="${s.k}"]`); if (b) { b.textContent = `${s.l} ${n[s.k]}`; b.classList.toggle("on", active.has(s.k)); } });

  const label = f === SANS ? "Sans tournée" : f === MINE ? "Mes tournées" : f || "Toutes les tournées";
  $("dtitle").textContent = label;
  $("dsub").textContent = `${total} points`;

  // donut
  const R = 56, C = 2 * Math.PI * R; let off = 0;
  const segs = ST.map(s => {
    const len = total ? n[s.k] / total * C : 0;
    const el = `<circle class="seg${active.has(s.k) ? "" : " off"}" data-k="${s.k}" r="${R}" cx="70" cy="70" fill="none" stroke="${s.c}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"></circle>`;
    off += len; return el;
  }).join("");
  const pct = total ? Math.round((total - n.a_faire) / total * 100) : 0;
  $("donut").innerHTML = `<svg viewBox="0 0 140 140"><circle r="${R}" cx="70" cy="70" fill="none" stroke="#e5e7eb" stroke-width="22"/>${segs}</svg>
    <div class="dc"><b>${pct}%</b><span>traités</span></div>`;
  $("donut").querySelectorAll(".seg").forEach(c => c.onclick = () => toggle(c.dataset.k));

  $("leg").innerHTML = ST.map(s => `<button data-k="${s.k}" class="${active.has(s.k) ? "" : "off"}"><span class="dot" style="background:${s.c}"></span>${s.l}
    <span class="n">${n[s.k]}</span><span class="p">${total ? Math.round(n[s.k] / total * 100) : 0} %</span></button>`).join("");
  $("leg").querySelectorAll("button").forEach(b => b.onclick = () => toggle(b.dataset.k));

  $("kpis").innerHTML = `<div class="kpi"><b>${EUR.format(sumF)}</b><span>${f ? "Total " + esc(label) : "Total global"}</span></div>
    <div class="kpi"><b>${f ? EUR.format(sumAll) : total - n.a_faire}</b><span>${f ? "Total global" : "points traités"}</span></div>`;

  // somme par jour
  const rows = [...days.entries()].sort((a, b) => b[0].localeCompare(a[0]));
  const max = Math.max(1, ...rows.map(([, d]) => d.sum));
  $("days").innerHTML = rows.length
    ? rows.map(([d, v]) => `<div class="day"><span>${fmtDay(d)}</span><div class="bar"><i style="width:${Math.max(3, v.sum / max * 100)}%"></i></div>
        <span class="v">${EUR.format(v.sum)}<small>${v.n} pt${v.n > 1 ? "s" : ""}</small></span></div>`).join("") +
      `<div class="tot"><span>Total${f ? " · " + esc(label) : ""}</span><span>${EUR.format(sumF)}</span></div>`
    : `<div class="empty">Aucune saisie pour le moment.</div><div class="tot"><span>Total</span><span>${EUR.format(0)}</span></div>`;
}

$("dbtn").onclick = () => $("dash").classList.add("open");
$("dclose").onclick = () => $("dash").classList.remove("open");

/* ---------- Administration ---------- */
$("adm").onclick = async () => {
  $("mtour").innerHTML = tournees.map(n => `<option>${esc(n)}</option>`).join("");
  $("panel").style.display = "block"; listMembres();
};
async function listPending() {
  const [u, m] = await Promise.all([SB.from("utilisateurs").select("email,role"), SB.from("membres").select("email")]);
  const has = new Set((m.data || []).map(x => x.email));
  const pend = (u.data || []).filter(x => x.role !== "admin" && !has.has(x.email));
  $("mpend").innerHTML = pend.map(x => `<button data-e="${esc(x.email)}">${esc(x.email)}</button>`).join("") || '<span class="msg">Aucun compte en attente.</span>';
  $("mpend").querySelectorAll("button").forEach(b => b.onclick = () => { $("memail").value = b.dataset.e; });
}
$("pclose").onclick = () => $("panel").style.display = "none";
async function listMembres() {
  listPending();
  const { data } = await SB.from("membres").select("email,tournee").order("email").order("tournee");
  $("mlist").innerHTML = (data || []).map(m => `<div class="mb"><span>${esc(m.email)} · <b>${esc(m.tournee)}</b></span>
    <button data-e="${esc(m.email)}" data-t="${esc(m.tournee)}">✕</button></div>`).join("") || '<div class="msg">Aucune affectation.</div>';
  $("mlist").querySelectorAll("button").forEach(b => b.onclick = async () => {
    await SB.from("membres").delete().eq("email", b.dataset.e).eq("tournee", b.dataset.t); listMembres();
  });
}
$("madd").onclick = async () => {
  const email = $("memail").value.trim().toLowerCase(); if (!email) return;
  const { error } = await SB.from("membres").insert({ email, tournee: $("mtour").value });
  if (error) toast(error.message); else { $("memail").value = ""; listMembres(); }
};
</script>
</body>
